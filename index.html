<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Shape Draw Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/screens.css" />
</head>

<body>

  <div id="rotate-warning">
    Vire o celular para jogar ▶️
  </div>

  <canvas id="game"></canvas>
  <img id="spriteSheet" src="./public/player.png">

  <div id="hud">
    <span id="score"></span>
    <span id="time"></span>
    <span id="lives"></span>
  </div>

  <div id="start-screen" class="overlay">
    <div class="popup">
      <h1>Shape Defender</h1>
      <p>Proteja-se desenhando as formas que aparecem!</p>

      <div class="form-group">
        <input
          type="text"
          id="player-name-input"
          class="form-input"
          placeholder="Digite seu nome"
        >
      </div>

      <div class="instructions">
        <div class="instruction-item"><span>◯</span> Desenhe um Círculo</div>
        <div class="instruction-item"><span>|</span> Desenhe uma Linha</div>
        <div class="instruction-item"><span>∨</span> Desenhe um V</div>
      </div>

      <p id="playerMessage" class="message"></p>
      <button id="start-button" class="btn btn--primary">COMEÇAR JOGO</button>
    </div>
  </div>

  <div id="game-over-screen" class="overlay">
    <div class="popup">
      <h1>Fim de Jogo!</h1>
      <p id="final-score-text">Você fez 0 pontos</p>

      <div id="game-over-ranking">
        <h3>🏆 Top Jogadores</h3>
        <ul id="gameOverRankingList" class="ranking-list">
          <li class="empty">Carregando...</li>
        </ul>
      </div>

      <div class="popup-actions">
        <button id="restart-button" class="btn btn--primary">JOGAR NOVAMENTE</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/canvas.js"></script>
  <script src="./js/player.js"></script>
  <script src="./js/shapes.js"></script>
  <script src="./js/stroke.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/score-local.js"></script>
  <script src="./js/score-manager.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/game.js"></script>

</body>

</html>
